services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: expense-tracker-db

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ExpenseTracker@12345"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ExpenseTracker@12345' -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - expense-tracker-network

  api:
    build:
      context: ./ExpenseTracker.Api
      dockerfile: ExpenseTracker.Api/Dockerfile

    container_name: expense-tracker-api

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DBConnection: "Server=database,1433;Database=ExpenseTrackerDb;User Id=sa;Password=ExpenseTracker@12345;TrustServerCertificate=True;"

    ports:
      - "8080:8080"

    depends_on:
      database:
        condition: service_healthy

    networks:
      - expense-tracker-network

  frontend:
    build:
      context: ./expense-tracker
      dockerfile: Dockerfile

    container_name: expense-tracker-frontend

    ports:
      - "4200:80"

    depends_on:
      - api

    networks:
      - expense-tracker-network

volumes:
  sqlserver_data:

networks:
  expense-tracker-network:
    driver: bridge
