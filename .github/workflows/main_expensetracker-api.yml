# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - ExpenseTracker-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.AZUREAPPSERVICE_CONTAINERREGISTRY_URL }}
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_755A4ADCDEE84E4889927E2DBB7D9C02 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_8D38CB3C4A03478FB2A31A6FBA941120 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_755A4ADCDEE84E4889927E2DBB7D9C02 }}.azurecr.io/appsvc/staticsite:${{ github.sha }}
          file: ./ExpenseTracker.Api/ExpenseTracker.Api/Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F7823F911EAB4FAC859C8CC4833E21A1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C03D016F36744DA1BC01832A87DA9739 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_918D1CE23F7844FCAB904DF68E5911D2 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'ExpenseTracker-api'
          slot-name: 'Production'
          images: 'mcr.microsoft.com/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_755A4ADCDEE84E4889927E2DBB7D9C02 }}/appsvc/staticsite:${{ github.sha }}'
          
